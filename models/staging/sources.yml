version: 2

sources:
  - name: raw
    database: "{{ target.database }}"
    schema: recruitment_raw

    tables:

      - name: orders_recrutement
        description: "Raw order-level data. Grain: one row per order."

        columns:

          - name: orders_id
            tests:
              - not_null
              - unique

          - name: customers_id
            tests:
              - not_null

          - name: date_date
            tests:
              - not_null

      - name: sales_recrutement
        description: "Raw order-product data. Grain: one row per order and product."

        columns:

          - name: order_id
            tests:
              - not_null

          - name: products_id
            tests:
              - not_null

          - name: qty
            tests:
              - not_null
